[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imperialism-format"
version = "0.1.0"
description = "Clean-room tools for Imperialism map and scenario formats"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
