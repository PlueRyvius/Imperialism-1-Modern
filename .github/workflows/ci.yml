name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: python -m compileall -q tools

  dotnet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.404"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: dotnet restore Imperialism.sln
      - run: dotnet build Imperialism.sln --no-restore --configuration Release
      - run: dotnet test Imperialism.sln --no-build --configuration Release

  art-budget:
    # The interface art is committed so the shell runs from a clone. That is
    # only defensible while it stays small, so the ceiling is enforced rather
    # than intended. Raising it is a decision, and this is where it gets made.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Committed art stays under 10 MB
        run: |
          size=$(du -sb src/Imperialism.Client/art | cut -f1)
          echo "committed art: $size bytes"
          test "$size" -le 10485760
