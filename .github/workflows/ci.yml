name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: python -m compileall -q tools

  dotnet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.404"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: dotnet restore Imperialism.sln
      - run: dotnet build Imperialism.sln --no-restore --configuration Release
      - run: dotnet test Imperialism.sln --no-build --configuration Release
